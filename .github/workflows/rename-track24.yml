name: Rename track 24
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename track 24 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv "music/the-long-night-and-the-morning-light.mp3" "music/24 - The Long Night and the Morning Light.mp3"
          git mv "covers/the-long-night-and-the-morning-light-cover-CLEAN-3000.jpg" "covers/24 - The Long Night and the Morning Light.jpg"
          git commit -m "Rename track 24 files to numbered pattern"
          git push
